<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ポケモン図鑑</title>
    <!-- css -->
    <link rel="stylesheet" href="./css/style.css">
    <!--font-awesomeの読み込み-->
    <link href="https://use.fontawesome.com/releases/v6.6.0/css/all.css" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo-img">
            <img src="./img/logo.png" alt="ロゴ">
        </div>

        <!-- ハンバーガーメニューアイコン -->
        <div class="hamburger" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div>
        <!-- メニュー本体 -->
        <nav id="menu" class="menu">
            <ul>
                <li>ホーム</li>
                <li>図鑑一覧</li>
            </ul>
        </nav>
    </header><!-- end header -->
    <main>
        <div class="center">
            <div class="title">
                <p>ポケットモンスター</p>
                <h2>151ずかん</h2>
            </div>

            <!-- 検索窓 -->
            <form id="searchForm" action="/" method="get">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" name="query" placeholder="ポケモンの名前で検索">
                </div>
            </form><!-- end form -->

            <!-- ランダムに表示される箱 -->
            <div id="random"></div>
        </div><!-- end center -->
    </main><!-- end main -->

    <!-- JavaScript読み込み -->
    <script src="./JS/script.js"></script>
</body>

</html>
